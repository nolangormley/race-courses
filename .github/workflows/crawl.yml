name: Weekly crawl

on:
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild every course, also the unchanged ones"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: crawl

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - run: uv run race-courses crawl ${{ inputs.force && '--force' || '' }}
      - name: Commit the changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Weekly crawl $(date -u +%Y-%m-%d)"
            git push
          fi
